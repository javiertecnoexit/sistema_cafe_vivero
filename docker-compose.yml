services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sistema_cafe_vivero}
      POSTGRES_USER: ${DB_USER:-vivero_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar-en-produccion}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  media:
