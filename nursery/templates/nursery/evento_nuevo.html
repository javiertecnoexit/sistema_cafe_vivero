{% extends "nursery/base.html" %}
{% block title %}Evento rápido{% endblock %}
{% block content %}
  <style>
    .card input, .card select, .card textarea { width: 100%; box-sizing: border-box; padding: .7rem; font-size: 1.05rem; }
    .card label { display: block; margin-top: .8rem; font-weight: 600; }
    .card ul, .card li { list-style: none; padding: 0; margin: 0; }
    .card li label { display: inline-block; margin-top: .3rem; }
  </style>
  <h2>Evento rápido</h2>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar evento</button>
    </form>
  </div>
  <p><a href="{% url 'inicio' %}">Volver al inicio</a></p>
{% endblock %}
