{% extends "nursery/base.html" %}
{% block title %}Medir {{ planta.codigo }}{% endblock %}
{% block content %}
  <h2>Medir — {{ planta.codigo }}</h2>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Guardar medición</button>
    </form>
  </div>
  <p><a href="{% url 'ficha_planta' planta.pk %}">Volver a la ficha</a></p>
{% endblock %}
