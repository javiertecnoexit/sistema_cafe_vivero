{% extends "nursery/base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
  <h2>Ingresar</h2>
  <div class="card">
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Ingresar</button>
    </form>
  </div>
{% endblock %}
